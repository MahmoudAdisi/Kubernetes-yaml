apiVersion: batch/v1
kind: CronJob
metadata:
  name: adisicronjob 
spec:
  schedule: "*/30 * 4 3 *"  
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: busybox
            image: busybox
            command: ["sleep","80"]
            restartPolicy: Never
          backoffLimit: 4
